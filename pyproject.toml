[project]
name = "harness-loop-py"
version = "0.1.0"
description = "Harness-engineering meta-loop in Python: an optimizer agent iterating on evals, with cost budget, per-category regression gate and human feedback in the loop."
readme = "README.md"
license = "MIT"
authors = [{ name = "Riccardo Gravinese", email = "riccardo.gravinese.bvu@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langfuse>=3",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "gitpython>=3.1",
    "langchain>=1",
    "typesafe-sdk==0.7.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "W"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"evals/run.py" = ["S607"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
